<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a shoot | Victory Studio Media House</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/site.css"><script src="js/icons.js"></script></head><body>
<header class="nav"><a class="brand" href="index.html"><svg class="ic"><use href="#i-camera"/></svg>Victory Studio</a><nav class="menu"><a href="index.html"><svg class="ic"><use href="#i-home"/></svg>Home</a><a href="catalogue.html"><svg class="ic"><use href="#i-tag"/></svg>Prices</a></nav></header>
<main id="bk"><h2 style="font-size:32px;margin:0 0 6px">Book a shoot</h2><p class="mu">Pick a service, a day and a time. Greyed-out times are already booked.</p>
<div class="card"><h3><svg class="ic"><use href="#i-camera"/></svg> 1. Service</h3><select id="sv" aria-label="Service"></select></div>
<div class="card"><h3><svg class="ic"><use href="#i-cal"/></svg> 2. Day</h3><div class="dayrow" id="days"></div></div>
<div class="card"><h3><svg class="ic"><use href="#i-clock"/></svg> 3. Time</h3><div class="slots" id="slots"><span class="mu">Choose a day first.</span></div></div>
<div class="card"><h3><svg class="ic"><use href="#i-mail"/></svg> 4. Your details</h3><div class="row"><input id="nm" placeholder="Your name" aria-label="Your name"><input id="ph" type="tel" placeholder="Phone / WhatsApp" aria-label="Phone"><input id="em" type="email" placeholder="Email (optional)" aria-label="Email"></div><textarea id="nt" placeholder="Tell us about your shoot (optional)" aria-label="Notes" style="margin-top:8px"></textarea><p class="mu" style="font-size:13px">We use your details only to arrange your shoot.</p><div id="sum" class="ok"></div><button class="btn" id="go" style="border:0;cursor:pointer;margin-top:8px">Request this booking</button></div>
<div class="card" id="done" hidden></div></main>
<script src="js/config.js"></script><script src="js/book.js"></script></body></html>
